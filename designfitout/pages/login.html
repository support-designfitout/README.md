<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Designfitout.com</title>
    <meta name="description" content="Secure login portal for Designfitout.com premium design services.">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <header>
        <h1>Client Portal Login</h1>
        <p>Access your premium design and fitout projects</p>
    </header>
    
    <main>
        <section class="login-form">
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="login-button">Login</button>
            </form>
        </section>
        
        <section class="placeholder-notice">
            <p><strong>Note:</strong> This is a placeholder login page. Authentication functionality will be implemented here.</p>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2025 Designfitout.com - Premium Design & Fitout Solutions</p>
    </footer>
</body>
</html>
