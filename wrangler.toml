name = "designfitout-api-worker"
main = "src/index.ts"
compatibility_date = "2024-11-20"
node_compat = true

# Define the global KV binding name
[[kv_namespaces]]
binding = "DESIGNFITOUT_CACHE"

[vars]
ENVIRONMENT = "development"

[env.production]
name = "designfitout-production"
route = "api.designfitoutlab.com/*"

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.kv_namespaces]]
binding = "DESIGNFITOUT_CACHE"
id = "YOUR_PRODUCTION_KV_ID_HERE"  # TODO: Replace with actual KV namespace ID

[env.staging]
name = "designfitout-staging"

[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.kv_namespaces]]
binding = "DESIGNFITOUT_CACHE"
id = "YOUR_STAGING_KV_ID_HERE"  # TODO: Replace with actual KV namespace ID
